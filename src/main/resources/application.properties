spring.application.name=kousaku

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kousaku?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo}
spring.datasource.username=${DB_USERNAME:kousaku_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
