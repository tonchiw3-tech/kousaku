spring.application.name=kousaku

spring.security.user.name=${STAFF_USERNAME}
spring.security.user.password=${STAFF_PASSWORD}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kousaku?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
