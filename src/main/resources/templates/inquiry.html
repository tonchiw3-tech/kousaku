<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ | KOSAKU</title><link rel="stylesheet" href="/css/inquiry.css"></head><body><main class="panel"><a href="/" class="brand">KOSAKU</a><h1>お問い合わせ</h1><p>ご質問やご相談をお聞かせください。</p><form id="inquiry-form"><label>お名前<input name="customerName" required maxlength="100"></label><label>メールアドレス<input name="email" type="email" required maxlength="254"></label><label>お問い合わせカテゴリ<select name="category" required><option value="">選択してください</option><option value="PRICE">料金</option><option value="AVAILABILITY">空き状況</option><option value="SOLO">一人参加</option><option value="DURATION">所要時間</option><option value="ACCESS">アクセス</option><option value="RAINY">雨天時</option><option value="FRAGRANCE">香りについて</option><option value="OTHER">その他</option></select></label><label>お問い合わせ内容<textarea name="message" rows="7" required maxlength="10000"></textarea></label><button>送信する</button></form><div id="result" class="result" hidden>お問い合わせを受け付けました。</div></main><script src="/js/inquiry.js"></script></body></html>
