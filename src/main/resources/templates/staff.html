<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタッフ予約一覧 | KOSAKU</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/staff.css"></head>
<body><header class="site-header"><a class="brand" href="/">KOSAKU <small>INIMU</small></a><nav class="staff-nav" aria-label="スタッフメニュー"><a class="is-current" href="/staff/reservations" aria-current="page">予約一覧</a><a href="/staff/calendar">カレンダー</a></nav><div class="staff-session"><span class="role-badge">スタッフ</span><form th:action="@{/logout}" method="post"><button class="logout-button" type="submit">ログアウト</button></form></div></header><main class="app-shell"><section class="section-heading"><p class="eyebrow">STAFF DASHBOARD</p><h1>予約一覧</h1><p>MySQLに保存された予約を表示しています。</p></section><section class="table-card"><div class="card-heading"><h2>予約一覧</h2><span id="reservation-count"></span></div><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>予約番号</th><th>予約日</th><th>予約時間</th><th>人数</th><th>名前</th><th>メール</th><th>初回/リピート</th><th>合計料金</th><th>ステータス</th><th>詳細</th></tr></thead><tbody id="reservation-list"><tr><td colspan="10">読み込み中…</td></tr></tbody></table></div><div id="reservation-cards" class="reservation-cards" aria-live="polite"></div><p id="error-message" class="no-data" hidden>予約一覧を取得できませんでした。</p></section></main><script src="/js/staff.js"></script></body></html>
