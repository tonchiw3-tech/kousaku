<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>予約詳細 | KOSAKU</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/staff.css"><link rel="stylesheet" href="/css/staff-detail.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">KOSAKU</a><nav class="staff-nav" aria-label="スタッフメニュー"><a class="is-current" href="/staff/reservations" aria-current="page">予約一覧</a><a href="/staff/calendar">カレンダー</a></nav><div class="staff-session"><span class="role-badge">スタッフ</span><form th:action="@{/logout}" method="post"><button class="logout-button" type="submit">ログアウト</button></form></div></header>
  <main class="app-shell"><section class="section-heading"><p class="eyebrow">RESERVATION DETAIL</p><h1>予約詳細</h1><p>予約内容と対応状況を確認できます。</p></section><section class="detail-panel reservation-detail-card">
    <dl id="reservation-detail"><div class="no-data">読み込み中…</div></dl>
    <section class="reservation-progress" aria-labelledby="progress-heading"><h2 id="progress-heading">予約対応の進捗</h2><p class="current-status">現在の予約ステータス：<strong id="current-status">読み込み中…</strong></p><ul class="progress-checklist"><li id="check-confirmed"><label><input class="progress-checkbox" type="checkbox"><span>予約内容を確認済み</span></label></li><li id="check-ready"><label><input class="progress-checkbox" type="checkbox"><span>当日の受け入れ準備完了</span></label></li><li id="check-completed"><label><input class="progress-checkbox" type="checkbox"><span>ワークショップ実施済み</span></label></li></ul><p id="completed-hint" class="action-message" hidden>未来の予約はワークショップ実施済みにできません。</p><p id="status-message" class="action-message" role="status"></p></section>
    <section class="reservation-actions" id="reservation-actions"><h2>キャンセル</h2><button id="cancel-button" class="secondary-button" type="button">予約をキャンセルする</button><p id="cancel-message" class="action-message" role="status"></p></section>
    <a class="secondary-button detail-back" href="/staff/reservations">予約一覧へ戻る</a>
  </section></main>
  <script src="/js/staff-reservation-checklist.js"></script>
</body>
</html>
