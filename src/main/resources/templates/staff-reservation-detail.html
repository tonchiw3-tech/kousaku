<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>予約詳細 | KOSAKU</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/staff.css"></head><body><header class="site-header"><a class="brand" href="/">KOSAKU</a><span class="header-note">スタッフ予約管理</span></header><main class="app-shell"><section class="section-heading"><p class="eyebrow">RESERVATION DETAIL</p><h1>予約詳細</h1><p>予約内容を確認できます。</p></section><section class="detail-panel reservation-detail-card"><dl id="reservation-detail"><div class="no-data">読み込み中…</div></dl><section class="reservation-progress" aria-labelledby="progress-heading"><h2 id="progress-heading">予約対応チェック</h2><ol class="progress-checklist"><li id="check-confirmed"><label><input class="progress-checkbox" type="checkbox" data-next-status="CONFIRMED"><span>予約内容を確認済み</span></label></li><li id="check-ready"><label><input class="progress-checkbox" type="checkbox" data-next-status="READY"><span>当日の受け入れ準備完了<small>物品準備・席の確保・人数分の資材確認</small></span></label></li><li id="check-completed"><label><input class="progress-checkbox" type="checkbox" data-next-status="COMPLETED"><span>ワークショップ実施済み</span></label></li></ol><div id="progress-action" class="progress-action"></div><p id="status-message" class="action-message" role="status"></p></section><section class="reservation-actions" aria-labelledby="status-revert-heading"><h2 id="status-revert-heading">対応状況</h2><button id="revert-status-button" class="secondary-button" type="button">対応状況を修正する</button><p id="revert-status-message" class="action-message" role="status"></p></section><section class="reservation-actions" aria-labelledby="cancel-heading"><h2 id="cancel-heading">キャンセル</h2><button id="cancel-button" class="secondary-button" type="button">予約をキャンセルする</button><p id="cancel-message" class="action-message" role="status"></p></section><section class="danger-zone" aria-labelledby="admin-heading"><h2 id="admin-heading">管理操作</h2><p>削除した予約データは元に戻せません。</p><button id="delete-button" class="danger-button" type="button">予約データを削除</button><p id="delete-message" class="action-message" role="status"></p></section><a class="secondary-button detail-back" href="/staff/reservations">予約一覧へ戻る</a></section></main><script src="/js/staff-reservation-detail.js"></script><script src="/js/staff-reservation-status.js"></script><script src="/js/staff-reservation-revert.js"></script></body></html>
