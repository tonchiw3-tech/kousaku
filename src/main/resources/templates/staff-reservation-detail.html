<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約詳細 | KOSAKU</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/staff.css"></head><body><header class="site-header"><a class="brand" href="/">KOSAKU</a><span class="header-note">スタッフ予約管理</span></header><main class="app-shell"><section class="section-heading"><p class="eyebrow">RESERVATION DETAIL</p><h1>予約詳細</h1><p>予約内容を確認できます。</p></section><section class="detail-panel reservation-detail-card"><dl id="reservation-detail"><div class="no-data">読み込み中…</div></dl><section class="reservation-progress" aria-labelledby="progress-heading"><h2 id="progress-heading">予約・対応管理</h2><p class="current-status">現在の予約ステータス：<strong id="current-status">読み込み中…</strong></p><ol class="progress-checklist"><li id="check-confirmed"><label><input class="progress-checkbox" type="checkbox" data-next-status="CONFIRMED"><span>予約内容を確認済み</span></label></li><li id="check-ready"><label><input class="progress-checkbox" type="checkbox" data-next-status="READY"><span>当日の受け入れ準備完了</span></label></li></ol><div id="progress-action" class="progress-action"></div><p id="status-message" class="action-message" role="status"></p></section><section class="reservation-actions"><h2>キャンセル</h2><button id="cancel-button" class="secondary-button" type="button">予約をキャンセルする</button><p id="cancel-message" class="action-message" role="status"></p></section><a class="secondary-button detail-back" href="/staff/reservations">予約一覧へ戻る</a></section></main><script src="/js/staff-reservation-detail-v2.js"></script></body></html>
