# Render demo profile: use an in-memory H2 database instead of the local/MySQL setup.
spring.datasource.url=jdbc:h2:mem:kousaku;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-render.sql
