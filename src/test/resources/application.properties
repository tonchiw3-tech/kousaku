# Test execution must use its own schema; do not fall back to the development database.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/kousaku_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${TEST_DB_USERNAME:${MYSQL_USER}}
spring.datasource.password=${TEST_DB_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
